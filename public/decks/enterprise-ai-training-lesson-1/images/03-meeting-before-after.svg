<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="900" viewBox="0 0 2100 900">
  <rect width="2100" height="900" fill="#fafaf8"/>
  <g font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="70" y="70" width="930" height="650" fill="#f0f0ee"/>
    <rect x="1100" y="70" width="930" height="650" fill="#002FA7"/>
    <text x="125" y="140" font-size="36" font-weight="700" fill="#0a0a0a">人工从零整理</text>
    <text x="1155" y="140" font-size="36" font-weight="700" fill="#ffffff">AI 生成初稿</text>
    <text x="125" y="355" font-size="205" font-weight="200" fill="#0a0a0a">20</text>
    <text x="420" y="355" font-size="58" font-weight="300" fill="#0a0a0a">分钟</text>
    <text x="1155" y="355" font-size="205" font-weight="200" fill="#ffffff">2</text>
    <text x="1320" y="355" font-size="58" font-weight="300" fill="#ffffff">分钟</text>
    <line x1="125" y1="420" x2="945" y2="420" stroke="#d4d4d2" stroke-width="3"/>
    <line x1="1155" y1="420" x2="1975" y2="420" stroke="#ffffff" stroke-width="3" opacity=".45"/>
    <text x="125" y="490" font-size="34" font-weight="500" fill="#0a0a0a">从散乱材料里重新组织</text>
    <text x="125" y="545" font-size="29" font-weight="300" fill="#525252">录音 / 聊天记录 / 手写笔记 / 会议结论 / 责任人 / 截止时间</text>
    <text x="1155" y="490" font-size="34" font-weight="500" fill="#ffffff">先出结构化初稿</text>
    <text x="1155" y="545" font-size="29" font-weight="300" fill="#ffffff">议题 / 结论 / 待办 / 风险点，人再判断和修正</text>
    <rect x="125" y="625" width="820" height="62" fill="#ffffff"/>
    <text x="160" y="665" font-size="27" font-weight="500" fill="#525252">人工确认：责任人、截止时间、结论是否准确</text>
    <rect x="1155" y="625" width="820" height="62" fill="#001f73"/>
    <text x="1190" y="665" font-size="27" font-weight="700" fill="#ffffff">AI 省的是起草时间，不省最后责任</text>
    <rect x="70" y="770" width="1960" height="58" fill="#0a0a0a"/>
    <text x="125" y="808" font-size="28" font-weight="300" fill="#ffffff">讲师提示：先让学员感受到“能省哪一段”，再讲方法论。</text>
  </g>
</svg>
