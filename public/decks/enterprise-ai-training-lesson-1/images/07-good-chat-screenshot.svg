<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fafaf8"/>
  <g font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="80" y="70" width="1440" height="720" fill="#f0f0ee"/>
    <rect x="80" y="70" width="1440" height="70" fill="#002FA7"/>
    <text x="122" y="116" font-size="24" font-weight="600" fill="#ffffff">AI Chat · 最小场景案例</text>

    <rect x="150" y="178" width="1120" height="132" fill="#ffffff"/>
    <text x="190" y="229" font-size="28" font-weight="300" fill="#0a0a0a">请把“客户沟通记录 → 下次微信跟进话术”整理成一个最小 AI 场景。</text>
    <text x="190" y="275" font-size="24" font-weight="300" fill="#525252">输出：任务名称 / 输入材料 / AI 输出 / 人工检查标准 / 暂不处理</text>

    <rect x="300" y="360" width="1070" height="340" fill="#ffffff"/>
    <text x="345" y="420" font-size="29" font-weight="600" fill="#0a0a0a">任务：客户沟通记录 → 下次微信跟进话术</text>
    <line x1="345" y1="455" x2="1320" y2="455" stroke="#d4d4d2" stroke-width="2"/>
    <text x="345" y="512" font-size="26" font-weight="300" fill="#525252">输入材料：客户类型 / 上次沟通 / 当前顾虑</text>
    <text x="345" y="565" font-size="26" font-weight="300" fill="#525252">AI 输出：120 字以内微信话术 + 使用提醒</text>
    <text x="345" y="618" font-size="26" font-weight="300" fill="#525252">人工检查：事实准确 / 无不当承诺 / 语气自然</text>
    <text x="345" y="671" font-size="26" font-weight="300" fill="#525252">暂不处理：投诉争议、价格承诺、合同条款</text>

    <rect x="150" y="735" width="1220" height="54" fill="#002FA7"/>
    <text x="190" y="771" font-size="25" font-weight="600" fill="#ffffff">变化：AI 不再给方向清单，而是产出一张可以执行、可以验收的任务卡。</text>

    <rect x="1300" y="178" width="110" height="132" fill="#002FA7"/>
    <text transform="translate(1368 290) rotate(-90)" font-size="22" font-weight="700" fill="#ffffff">TASK CARD</text>
  </g>
</svg>
