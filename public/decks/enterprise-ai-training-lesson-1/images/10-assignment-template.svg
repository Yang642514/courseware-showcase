<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#fafaf8"/>
  <g font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">
    <text x="70" y="76" font-size="34" font-weight="600" fill="#737373" letter-spacing="4">SAMPLE CARD</text>
    <text x="70" y="136" font-size="54" font-weight="200" fill="#0a0a0a">岗位 AI 场景卡</text>
    <line x1="70" y1="176" x2="1130" y2="176" stroke="#0a0a0a" stroke-width="2"/>

    <rect x="70" y="225" width="1060" height="520" fill="#f0f0ee"/>
    <rect x="70" y="225" width="1060" height="74" fill="#0a0a0a"/>
    <text x="110" y="273" font-size="29" font-weight="500" fill="#ffffff">示例 01 / 03 · 销售 / 客户跟进</text>

    <g font-size="31" font-weight="300" fill="#0a0a0a">
      <text x="115" y="365">任务</text>
      <rect x="250" y="323" width="790" height="60" fill="#ffffff"/>
      <text x="280" y="364" fill="#525252">根据客户沟通记录生成下次微信跟进话术</text>

      <text x="115" y="452">输入</text>
      <rect x="250" y="410" width="790" height="60" fill="#ffffff"/>
      <text x="280" y="451" fill="#525252">客户类型 / 上次沟通 / 当前顾虑</text>

      <text x="115" y="539">输出</text>
      <rect x="250" y="497" width="790" height="60" fill="#ffffff"/>
      <text x="280" y="538" fill="#525252">120 字微信话术 + 使用提醒</text>

      <text x="115" y="626">检查</text>
      <rect x="250" y="584" width="790" height="60" fill="#ffffff"/>
      <text x="280" y="625" fill="#525252">事实准确 / 无不当承诺 / 语气自然</text>

      <text x="115" y="713">暂不处理</text>
      <rect x="250" y="671" width="790" height="48" fill="#ffffff"/>
      <text x="280" y="705" font-size="27" fill="#737373">自动发消息、自动改客户标签</text>
    </g>

    <rect x="70" y="790" width="1060" height="64" fill="#002FA7"/>
    <text x="110" y="832" font-size="28" font-weight="300" fill="#ffffff">一人提交 3 张。第 2 课直接拿它写提示词模板。</text>
  </g>
</svg>
