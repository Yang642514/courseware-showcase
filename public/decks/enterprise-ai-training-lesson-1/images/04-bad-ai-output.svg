<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="900" viewBox="0 0 2100 900">
  <rect width="2100" height="900" fill="#fafaf8"/>
  <g font-family="Inter, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="70" y="60" width="1960" height="106" fill="#0a0a0a"/>
    <text x="125" y="126" font-size="36" font-weight="300" fill="#ffffff">泛输入：我想用 AI 提升销售效率，你帮我看看可以怎么做。</text>
    <line x1="1045" y1="205" x2="1045" y2="770" stroke="#d4d4d2" stroke-width="2"/>
    <text x="125" y="250" font-size="36" font-weight="700" fill="#0a0a0a">AI 会给很多“正确方向”</text>
    <text x="1130" y="250" font-size="36" font-weight="700" fill="#002FA7">但没有第一步动作</text>
    <g font-size="30" font-weight="300">
      <rect x="125" y="305" width="385" height="140" fill="#f0f0ee"/>
      <text x="160" y="365" fill="#0a0a0a">客户画像分析</text>
      <text x="160" y="410" fill="#737373" font-size="23">方向太宽</text>
      <rect x="575" y="305" width="385" height="140" fill="#f0f0ee"/>
      <text x="610" y="365" fill="#0a0a0a">销售话术优化</text>
      <text x="610" y="410" fill="#737373" font-size="23">不知道改哪句</text>
      <rect x="125" y="485" width="385" height="140" fill="#f0f0ee"/>
      <text x="160" y="545" fill="#0a0a0a">数据分析报表</text>
      <text x="160" y="590" fill="#737373" font-size="23">没有输入数据</text>
      <rect x="575" y="485" width="385" height="140" fill="#f0f0ee"/>
      <text x="610" y="545" fill="#0a0a0a">自动化跟进</text>
      <text x="610" y="590" fill="#737373" font-size="23">超出当前能力</text>
    </g>
    <rect x="1130" y="305" width="780" height="320" fill="#002FA7"/>
    <text x="1185" y="382" font-size="46" font-weight="300" fill="#ffffff">问题没有被缩小</text>
    <text x="1185" y="455" font-size="31" font-weight="300" fill="#ffffff">没有明确任务 / 没有输入材料 / 没有输出样子</text>
    <text x="1185" y="515" font-size="31" font-weight="300" fill="#ffffff">AI 只能回到“方向建议”，不能给可执行初稿</text>
    <rect x="1130" y="680" width="780" height="70" fill="#0a0a0a"/>
    <text x="1185" y="725" font-size="30" font-weight="500" fill="#ffffff">结果：听完知道很多方向，但不知道今天做什么。</text>
  </g>
</svg>
